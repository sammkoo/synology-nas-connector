name: Test and build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run spk
      - run: npm run test:spk
      - uses: actions/upload-artifact@v4
        if: matrix.node == 22
        with:
          name: synology-spk
          path: artifacts/*
          if-no-files-found: error
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nas-connector:ci .
      - run: python3 scripts/test-docker.py
      - name: Export tested gateway image for offline NAS import
        run: |
          mkdir -p gateway-image
          docker tag nas-gateway-synology:ci nas-connector-gateway:git-${GITHUB_SHA}
          docker save nas-connector-gateway:git-${GITHUB_SHA} | gzip -n > gateway-image/nas-connector-gateway.tar.gz
          cd gateway-image
          sha256sum nas-connector-gateway.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-image-amd64
          path: gateway-image/*
          if-no-files-found: error
          retention-days: 14
